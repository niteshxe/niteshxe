<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>niteshxe.dev</title>
    <meta name="description" content="niteshxe.dev is coming soon. GSAP-Animated Swiss Grid Design.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@100;500;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
            --accent: #FF0000;
            --border: rgba(255, 255, 255, 0.4);
            --font-display: 'Archivo Black', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-display);
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ── HEADER ── */
        header {
            position: relative;
            z-index: 100;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
        }

        #header-logo {
            opacity: 0;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
            opacity: 0;
        }

        .social-links a {
            color: var(--text);
            text-decoration: none;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .social-links a:hover { opacity: 1; }

        .social-links i {
            font-size: 1.25rem;
            display: inline-block;
            vertical-align: middle;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            display: inline-block;
            margin-right: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ── COMING SOON label ── */
        .dev-status {
            font-family: var(--font-mono);
            font-size: clamp(0.55rem, 1.5vw, 0.7rem);
            letter-spacing: 0.4rem;
            text-transform: uppercase;
            color: var(--text);
            text-align: center;
            padding: 0.5rem 1rem 0;
            pointer-events: none;
        }

        .status-word {
            opacity: 0;
            display: inline-block;
        }

        .dev-status span { color: var(--accent); }

        /* ── GRID ── */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            flex: 1;
            width: 100%;
            padding: 1.5rem 2rem;
            gap: 1rem;
            align-items: center;
        }

        .grid-segment {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        .timer-box {
            border: 0.5px solid var(--border);
            padding: clamp(1rem, 2vw, 2.5rem);
            width: 100%;
            aspect-ratio: 1 / 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: transparent;
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(20px);
        }

        .grid-segment:hover .timer-box {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text);
            transform: scale(1.05);
        }

        .timer-value {
            font-size: clamp(2.5rem, 6vw, 10rem);
            font-weight: 900;
            line-height: 0.85;
            letter-spacing: -0.02em;
            text-align: center;
            width: 100%;
        }

        .timer-label {
            font-family: var(--font-mono);
            font-size: clamp(0.45rem, 1vw, 0.65rem);
            letter-spacing: 0.3rem;
            text-transform: uppercase;
            margin-top: 1rem;
            color: var(--border);
            transition: all 0.4s ease;
        }

        .grid-segment:hover .timer-label {
            color: var(--text);
            transform: translateY(-5px);
        }

        /* ── FOOTER ── */
        .meta-footer {
            font-family: var(--font-mono);
            font-size: clamp(0.5rem, 1.5vw, 0.6rem);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--border);
            opacity: 0;
            padding: 1rem 2rem 1.5rem;
        }

        /* ── MOBILE ── */
        @media (max-width: 600px) {
            header {
                padding: 1.25rem 1.25rem;
                font-size: 0.6rem;
                letter-spacing: 0.1rem;
            }

            #header-logo { font-size: 0.6rem; }

            .social-links {
                gap: 1rem;
            }

            .social-links i { font-size: 1.1rem; }

            .dev-status {
                letter-spacing: 0.25rem;
                padding: 0.75rem 1rem 0;
            }

            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(2, 1fr);
                padding: 0.75rem 1.25rem;
                gap: 0.75rem;
                flex: 1;
            }

            .timer-box {
                aspect-ratio: 1 / 1;
                padding: 1rem;
            }

            .timer-value {
                font-size: clamp(2.8rem, 15vw, 5rem);
            }

            .timer-label {
                font-size: 0.5rem;
                letter-spacing: 0.2rem;
                margin-top: 0.6rem;
            }

            .meta-footer {
                padding: 0.75rem 1.25rem 1.25rem;
                text-align: center;
                letter-spacing: 0.05em;
            }
        }

        /* ── TABLET ── */
        @media (min-width: 601px) and (max-width: 900px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(2, 1fr);
                padding: 1rem 1.5rem;
                gap: 1rem;
            }

            .timer-value {
                font-size: clamp(3rem, 12vw, 7rem);
            }
        }
    </style>
</head>
<body>

    <header id="header">
        <div id="header-logo">
            <div class="status-dot" id="dot"></div>
            NITESHXE.DEV >>
        </div>
        <div class="social-links" id="socials">
            <a href="https://www.instagram.com/nitesh.xe/" target="_blank" title="Instagram"><i class="ph-thin ph-instagram-logo"></i></a>
            <a href="https://www.linkedin.com/in/niteshxe/" target="_blank" title="LinkedIn"><i class="ph-thin ph-linkedin-logo"></i></a>
            <a href="https://github.com/niteshxe" target="_blank" title="GitHub"><i class="ph-thin ph-github-logo"></i></a>
            <a href="mailto:niteshxe.dev@gmail.com" title="Email"><i class="ph-thin ph-envelope-simple"></i></a>
        </div>
    </header>

    <div class="dev-status" id="dev-status">
        <span class="status-word">COMING</span>&nbsp;
        <span class="status-word">SOON</span>
    </div>

    <div class="grid-container">
        <div class="grid-segment">
            <div class="timer-box">
                <span class="timer-value" id="days">00</span>
                <span class="timer-label">DAYS</span>
            </div>
        </div>
        <div class="grid-segment">
            <div class="timer-box">
                <span class="timer-value" id="hours">00</span>
                <span class="timer-label">HOURS</span>
            </div>
        </div>
        <div class="grid-segment">
            <div class="timer-box">
                <span class="timer-value" id="minutes">00</span>
                <span class="timer-label">MINUTES</span>
            </div>
        </div>
        <div class="grid-segment">
            <div class="timer-box">
                <span class="timer-value" id="seconds">00</span>
                <span class="timer-label">SECONDS</span>
            </div>
        </div>
    </div>

    <div class="meta-footer" id="footer">
        EST. 2026 // LOC: UTC+5:30 // NITESHXE
    </div>

    <script>
        const launchDate = new Date("May 05, 2026 14:49:17").getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d.toString().padStart(2, '0');
            document.getElementById("hours").innerText = h.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = m.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = s.toString().padStart(2, '0');

            if (distance < 0) {
                clearInterval(interval);
                document.querySelector(".grid-container").innerHTML = "<h1 style='grid-column:1/-1;text-align:center;font-size:4rem;'>LIVE</h1>";
            }
        }

        window.addEventListener('load', () => {
            const tl = gsap.timeline({ defaults: { ease: "expo.out" } });

            tl.to(".grid-segment", { opacity: 1, duration: 1, stagger: 0.1 });
            tl.to(["#header-logo", "#socials", ".status-word", "#footer"], {
                opacity: 1, duration: 1, stagger: 0.15
            }, "-=0.5");
            tl.to(".timer-box", {
                opacity: 1, y: 0, duration: 1, stagger: 0.1, ease: "power2.out"
            }, "-=0.8");

            gsap.to("#dot", {
                opacity: 0.4, duration: 0.8, repeat: -1, yoyo: true, ease: "power2.inOut"
            });
        });

        // Hover Parallax — desktop only
        if (window.innerWidth > 600) {
            document.querySelectorAll('.grid-segment').forEach(seg => {
                seg.addEventListener('mousemove', (e) => {
                    const rect = seg.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width - 0.5;
                    const y = (e.clientY - rect.top) / rect.height - 0.5;
                    gsap.to(seg.querySelector('.timer-box'), {
                        x: x * 15, y: y * 15, duration: 0.4, ease: "power1.out"
                    });
                });
                seg.addEventListener('mouseleave', () => {
                    gsap.to(seg.querySelector('.timer-box'), {
                        x: 0, y: 0, duration: 0.8, ease: "elastic.out(1, 0.3)"
                    });
                });
            });
        }

        updateTimer();
        const interval = setInterval(updateTimer, 1000);
    </script>
</body>
</html>
