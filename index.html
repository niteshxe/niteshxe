<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>niteshxe.dev </title>
    <!-- SEO -->
    <meta name="description" content="niteshxe.dev is coming soon. GSAP-Animated Swiss Grid Design.">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@100;500;800&display=swap" rel="stylesheet">
    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
            --accent: #FF0000; /* Swiss Red */
            --border: rgba(255, 255, 255, 0.4);
            --font-display: 'Archivo Black', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-display);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Small Branding */
        header {
            position: absolute;
            top: 2rem;
            left: 2rem;
            right: 2rem;
            z-index: 100;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #header-logo {
            opacity: 0; /* Animated by GSAP */
        }

        .social-links {
            display: flex;
            gap: 2rem;
            opacity: 0; /* Animated by GSAP */
        }

        .social-links a {
            color: var(--text);
            text-decoration: none;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .social-links a:hover {
            opacity: 1;
        }

        .social-links i {
            font-size: 1.25rem;
            display: inline-block;
            vertical-align: middle;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            display: inline-block;
            margin-right: 8px;
            border-radius: 50%;
        }

        /* Grid System */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            height: 100vh;
            width: 100vw;
            position: relative;
            padding: 2rem;
            gap: 1.5rem;
        }

        .grid-segment {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            position: relative;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .timer-box {
            border: 0.5px solid var(--border);
            padding: clamp(1rem, 2vw, 3rem);
            width: 100%;
            max-width: 280px;
            aspect-ratio: 1 / 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: transparent;
            transition: all 0.4s ease;
            opacity: 0; /* Animated by GSAP */
            transform: translateY(20px);
            z-index: 5;
        }

        .grid-segment:hover .timer-box {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text);
            transform: scale(1.05);
        }

        .grid-segment:last-child {
            border-right: none;
        }

        .grid-segment:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .grid-segment:hover .timer-label {
            color: var(--text);
            transform: translateY(-5px);
        }

        .timer-value {
            font-size: clamp(2rem, 10vw, 12rem);
            font-weight: 900;
            line-height: 0.8;
            letter-spacing: -0.02em;
            text-align: center;
            width: 100%;
        }

        .timer-label {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 0.3rem;
            text-transform: uppercase;
            margin-top: 1.5rem;
            color: var(--border);
            transition: all 0.4s ease;
        }

        .grid-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            pointer-events: none;
        }

        /* Meta Bottom Left */
        .meta-footer {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            font-family: var(--font-mono);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--border);
            opacity: 0; /* Animated by GSAP */
        }

        /* Sub-header */
        .dev-status {
            position: absolute;
            top: 18%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            letter-spacing: 0.4rem;
            text-transform: uppercase;
            color: var(--text);
            
            padding: 0.5rem 2rem;
            z-index: 20;
            white-space: nowrap;
            pointer-events: none;
        }

        .status-word {
            opacity: 0; /* Animated by GSAP */
            display: inline-block;
        }

        .dev-status span {
            color: var(--accent);
        }

        /* Mobile Layout */
        @media (max-width: 900px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(2, 1fr);
                padding: 1rem;
                gap: 1rem;
            }
            header { top: 1.5rem; left: 1.5rem; }
            .meta-footer { bottom: 1.5rem; left: 1.5rem; }
        }
    </style>
</head>
<body>
    <header id="header">
        <div id="header-logo">
            <div class="status-dot" id="dot"></div>
            NITESHXE.DEV >>
        </div>
        <div class="social-links" id="socials">
            <a href="https://www.instagram.com/nitesh.xe/" target="_blank" title="Instagram"><i class="ph-thin ph-instagram-logo"></i></a>
            <a href="https://www.linkedin.com/in/niteshxe/" target="_blank" title="LinkedIn"><i class="ph-thin ph-linkedin-logo"></i></a>
            <a href="https://github.com/niteshxe" target="_blank" title="GitHub"><i class="ph-thin ph-github-logo"></i></a>
            <a href="mailto:niteshxe.dev@gmail.com" title="Email"><i class="ph-thin ph-envelope-simple"></i></a>
        </div>
    </header>

    <div class="dev-status" id="dev-status">
         <span class="status-word">COMMING</span> 
         <span class="status-word">SOON</span>
    </div>

    <div class="grid-container">
        <div class="grid-segment">
            <div class="timer-box">
                <span class="timer-value" id="days">00</span>
                <span class="timer-label">DAYS</span>
            </div>
        </div>
        <div class="grid-segment">
            <div class="timer-box">
                <span class="timer-value" id="hours">00</span>
                <span class="timer-label">HOURS</span>
            </div>
        </div>
        <div class="grid-segment">
            <div class="timer-box">
                <span class="timer-value" id="minutes">00</span>
                <span class="timer-label">MINUTES</span>
            </div>
        </div>
        <div class="grid-segment">
            <div class="timer-box">
                <span class="timer-value" id="seconds">00</span>
                <span class="timer-label">SECONDS</span>
            </div>
        </div>
    </div>

    <div class="meta-footer" id="footer">
        EST. 2026 // LOC: UTC+5:30 // NITESHXE
    </div>

    <script>
        // Set the countdown date (1 month from now)
        // Current date: 2026-04-05
        const launchDate = new Date("May 05, 2026 14:49:17").getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);

            // Update UI with GSAP Snap to integers
            document.getElementById("days").innerText = d.toString().padStart(2, '0');
            document.getElementById("hours").innerText = h.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = m.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = s.toString().padStart(2, '0');

            if (distance < 0) {
                clearInterval(interval);
                document.querySelector(".grid-container").innerHTML = "<h1>LIVE</h1>";
            }
        }

        // GSAP Animations
        window.addEventListener('load', () => {
            const tl = gsap.timeline({ defaults: { ease: "expo.out" } });

            // 1. Grid Fade-in
            tl.to(".grid-segment", {
                opacity: 1,
                duration: 1,
                stagger: 0.1
            });

            // 2. Header, Footer & Status Fade-in
            tl.to(["#header-logo", "#socials", ".status-word", "#footer"], {
                opacity: 1,
                duration: 1,
                stagger: 0.15
            }, "-=0.5");

            // 3. Timer Boxes staggered reveal
            tl.to(".timer-box", {
                opacity: 1,
                y: 0,
                duration: 1,
                stagger: 0.1,
                ease: "power2.out"
            }, "-=0.8");

            // 4. Labels are already visible in the boxes

            // Status Dot Pulsing
            gsap.to("#dot", {
                opacity: 0.4,
                duration: 0.8,
                repeat: -1,
                yoyo: true,
                ease: "power2.inOut"
            });
        });

        // Hover Parallax (Subtle)
        document.querySelectorAll('.grid-segment').forEach(seg => {
            seg.addEventListener('mousemove', (e) => {
                const rect = seg.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width - 0.5;
                const y = (e.clientY - rect.top) / rect.height - 0.5;
                
                gsap.to(seg.querySelector('.timer-box'), {
                    x: x * 15,
                    y: y * 15,
                    duration: 0.4,
                    ease: "power1.out"
                });
            });

            seg.addEventListener('mouseleave', () => {
                gsap.to(seg.querySelector('.timer-box'), {
                    x: 0,
                    y: 0,
                    duration: 0.8,
                    ease: "elastic.out(1, 0.3)"
                });
            });
        });

        // Initial call
        updateTimer();
        // Update every second
        const interval = setInterval(updateTimer, 1000);
    </script>
</body>
</html>
